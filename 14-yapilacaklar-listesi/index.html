<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yapılacaklar Listesi (To-Do App)</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="app">
        <header>
            <div class="icon">📝</div>
            <h1>Yapılacaklar Listesi</h1>
            <p>Günlük görevlerini düzenli takip et, verimliliğini artır.</p>
        </header>

        <form id="gorevFormu" class="task-form">
            <input id="gorevInput" type="text" placeholder="Yeni bir görev yazın..." autocomplete="off">
            <button type="submit" id="ekleBtn">Ekle</button>
        </form>

        <div class="status-bar">
            <span id="gorevSayisi">0 görev</span>
            <span id="tamamlananSayisi">0 tamamlandı</span>
        </div>

        <ul id="gorevListesi" class="task-list"></ul>

        <p id="bosMesaj" class="empty-state">Henüz eklenmiş bir görev yok. Yeni görev ekleyebilirsiniz!</p>

        <footer>
            Geliştirici: <strong>Bilal Sezer</strong> · JavaScript LocalStorage Projesi
        </footer>
    </main>
</body>
</html>

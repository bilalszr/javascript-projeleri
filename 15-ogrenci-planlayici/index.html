<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öğrenci Çalışma Planlayıcısı</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">📅</div>
            <h1>Öğrenci Çalışma Planlayıcısı</h1>
            <p>Ders, sınav, proje ve ödevlerini tarihlerine göre planla ve yönet.</p>
        </header>

        <section class="stats">
            <div class="stat-card">
                <span class="stat-number" id="toplamGorev">0</span>
                <span class="stat-label">Toplam Plan</span>
            </div>
            <div class="stat-card">
                <span class="stat-number" id="aktifGorev">0</span>
                <span class="stat-label">Bekleyen</span>
            </div>
            <div class="stat-card">
                <span class="stat-number" id="bitmisGorev">0</span>
                <span class="stat-label">Tamamlanan</span>
            </div>
        </section>

        <section class="card form-section">
            <h2>Yeni Plan Ekle</h2>
            <form id="gorevFormu" class="form-grid">
                <div class="form-field full-width">
                    <label for="gorevAdi">Görev / Konu Adı</label>
                    <input type="text" id="gorevAdi" placeholder="Örn: JavaScript Algoritmaları Çalış" required>
                </div>
                <div class="form-field">
                    <label for="kategori">Kategori</label>
                    <select id="kategori">
                        <option value="Ders Çalışma">📚 Ders Çalışma</option>
                        <option value="Ödev">✏️ Ödev</option>
                        <option value="Sınav Hazırlık">🎯 Sınav Hazırlık</option>
                        <option value="Proje">💻 Proje</option>
                        <option value="Diğer">📌 Diğer</option>
                    </select>
                </div>
                <div class="form-field">
                    <label for="tarih">Son Tarih</label>
                    <input type="date" id="tarih">
                </div>
                <div class="form-field full-width">
                    <button type="submit" class="submit-btn">+ Plana Ekle</button>
                </div>
            </form>
        </section>

        <section class="card list-section">
            <div class="filter-bar">
                <h2>Planlarım</h2>
                <div class="filter-controls">
                    <label for="filtre">Filtrele:</label>
                    <select id="filtre">
                        <option value="hepsi">Tümü</option>
                        <option value="aktif">Bekleyenler</option>
                        <option value="tamamlanan">Tamamlananlar</option>
                    </select>
                </div>
            </div>

            <ul id="gorevListesi" class="task-list"></ul>
            <p id="bosMesaj" class="empty-state">Henüz eklenmiş bir planınız bulunmuyor.</p>
        </section>

        <footer>
            Geliştirici: <strong>Bilal Sezer</strong> · JavaScript Öğrenci Portalı
        </footer>
    </div>
</body>
</html>
